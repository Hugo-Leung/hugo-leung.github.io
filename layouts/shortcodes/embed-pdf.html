  <div class="pdf-container">
  <style>
    @scope {
      .pdf-fallback {
        display: none;
        text-align: center;
        padding: 10px;
        background: #f4f4f4;
        border: 1px solid #ddd;
        border-radius: 4px;
      }

      .download-btn {
        display: inline-block;
        padding: 10px 20px;
        /*background: #0073e6;*/
        color: #fff;
        text-decoration: none;
        border-radius: 4px;
      }

      /* Hide embed and show download prompt on screens smaller than 850px */
      @media screen and (max-width: 850px) {
        embed {
          display: none;
        }

        .pdf-fallback {
          display: block;
        }
      }
    }
  </style>

    <embed src="{{ .Get 0 }}" type="application/pdf" width="100%" height="600px">
    <div class="pdf-fallback">
      <a href="{{ .Get 0 }}" class="download-btn" download>Download PDF</a>
    </div>
  </div>
